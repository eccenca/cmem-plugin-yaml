# https://taskfile.dev
---
version: '3'

tasks:

  install:
    desc: Install plugin package in Corporate Memory
    cmds:
      - task build
      - uv run cmemc admin workspace python install dist/cmem_plugin_yaml*.tar.gz
      - uv run cmemc admin workspace python list-plugins

  uninstall:
    desc: Uninstall plugin package in Corporate Memory
    cmds:
      - task build
      - uv run cmemc admin workspace python uninstall cmem-plugin-yaml
      - uv run cmemc admin workspace python list-plugins
