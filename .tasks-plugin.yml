# https://taskfile.dev
---
version: '3'

tasks:

  deploy:
    desc: Install plugin package in Corporate Memory
    deps:
      - build
    cmds:
      - cmemc admin workspace python install dist/*.tar.gz
      - cmemc admin workspace python list-plugins

  uninstall:
    desc: Uninstall plugin package in Corporate Memory
    cmds:
      - task build
      - poetry run cmemc admin workspace python uninstall cmem-plugin-yaml
      - poetry run cmemc admin workspace python list-plugins
