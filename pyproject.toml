[project]
name = "cmem-plugin-yaml"
description = "Parse YAML documents into JSON files or entities."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README-public.md"
authors = [
    { name = "eccenca GmbH", email = "cmempy-developer@eccenca.com" },
]
# if you need to change the python version here, change it also in .python-version
requires-python = ">=3.13,<4"
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
]
keywords = [
    "eccenca Corporate Memory", "plugin"
]
dependencies = [
    "cmem-plugin-base>=4.20.0,<5",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Homepage = "https://github.com/eccenca/cmem-plugin-yaml"

[dependency-groups]
dev = [
    "cmem-cmemc>=24.2.0",
    "deptry>=0.25.1,<0.26",
    "genbadge[coverage]>=1.1.3,<2",
    "mypy>=2.3.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-html>=4.2.0,<5",
    "pytest-memray>=1.10.0,<2 ; platform_system != 'Windows'",
    "ruff>=0.16.2,<0.17",
    "trivy-py-ecc>=0.76.0.1,<0.77",
    "types-pyyaml>=6.0.12.12,<7",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
# The sdist ships the package directory and nothing else. hatchling
# force-includes the readme, the license and .gitignore from the metadata, so
# they need no entry here.
only-include = ["cmem_plugin_yaml"]

[tool.uv-dynamic-versioning]
vcs = "git"
bump = true
dirty = true

[tool.uv]
required-version = ">=0.11.7"
# uv's cache is aggressive and does not know this project's version is dynamic.
# Without these keys a stale version is served after a new tag.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.mypy]
warn_return_any = true
ignore_missing_imports = true

# Deliberately empty. pytest walks upward until a file *loads* a configuration,
# and only the presence of this table makes pyproject.toml one - without it the
# walk carries on into the parent directories, where any pytest.ini, tox.ini or
# setup.cfg, even an empty one, would set this project's rootdir and could push
# its own addopts into this test suite. Do not tidy it away.
[tool.pytest.ini_options]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    ]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
line-ending = "lf" # Use `\n` line endings for all files

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN204",  # Missing return type annotation for special method `__init__`
    "COM812",  # missing-trailing-comma
    "CPY001",  # Missing copyright notice
    "D107",    # Missing docstring in __init__
    "D203",    # [*] 1 blank line required before class docstring
    "D211",    # No blank lines allowed before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "D400",    # First line should end with a period
    "D415",    # First line should end with a period, question mark, or exclamation point
    "EM",      # Exception texts - https://docs.astral.sh/ruff/rules/#flake8-errmsg-em
    "FBT",     # The Boolean Trap - https://docs.astral.sh/ruff/rules/#flake8-boolean-trap-fbt
    "FIX002",  # Allow to add TODO notes in the code
    "G004",    # Logging statement uses f-string
    "ISC001",  # single-line-implicit-string-concatenation
    "PD",      # opinionated linting for pandas code
    "TRY003",  # Avoid specifying long messages outside the exception class
    "TRY400",  # PluginLogger has no exception(), so error() is the only option
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # asserts allowed in tests
    "ARG",     # unused function args (pytest fixtures)
    "PLR2004", # in an assertion the expected value is the literal
]
